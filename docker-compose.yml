services:
  backend:
    build: ./backend
    environment:
      MARKDOWN_WORKSPACE: /workspace
      # Cap depth as a safety net for large workspaces; skipped folders use
      # the default list (set MARKDOWN_SKIP_DIRS here to change it)
      MARKDOWN_MAX_DEPTH: "8"
      # Same-origin through nginx, so no cross-origin access at all
      MARKDOWN_CORS_ORIGINS: ""
    volumes:
      # The folder to browse: set WORKSPACE_DIR in .env or the shell
      - ${WORKSPACE_DIR:-./workspace}:/workspace:ro
    # Not published: only nginx (frontend) reaches it, as backend:8000
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      # Loopback only — not reachable from other machines on the network
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
