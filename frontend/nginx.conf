server {
    listen 3000;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Documents are sanitized before rendering (MarkdownViewer.tsx); the CSP
    # is the second layer: no inline scripts, frames, plugins, forms or
    # <base> rewriting even if markup slipped through.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
