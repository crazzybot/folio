# Dependency update PRs, grouped so each run opens at most two PRs per
# package (minor + patch together, majors together) and one each for
# Docker images and GitHub Actions. A major update that breaks something
# can be split out with "@dependabot ignore this major version".
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only (8.72); remove this
      # once a release accepts newer TypeScript
      - dependency-name: typescript
        versions: [">= 6.1.0"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      major: { update-types: [major] }

  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      major: { update-types: [major] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      major: { update-types: [major] }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    ignore:
      # Node majors are chosen by hand: only even (LTS) releases, and CI's
      # node-version in ci.yml / release.yml must move with them.
      # Minor and patch updates of the chosen major still come through.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
