# Dependency update PRs, grouped so each run opens at most two PRs per
# package (minor + patch together, majors together) and one for GitHub
# Actions. A major update that breaks something
# can be split out with "@dependabot ignore this major version".
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only (8.72); remove this
      # once a release accepts newer TypeScript
      - dependency-name: typescript
        versions: [">= 6.1.0"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      major: { update-types: [major] }

  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      major: { update-types: [major] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
