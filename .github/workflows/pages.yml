# Publish the product site (site/) to GitHub Pages, with the live demo
# (docs/design/live-demo.md) built from main in demo/ and the user docs
# (docs-site/) in docs/.
# One-time setup: Settings → Pages → Source: GitHub Actions.
# The download links read the latest release at view time, so publishing a
# release doesn't need a site deploy.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs-site/**
      - .github/workflows/pages.yml
      # The demo: its content, the app, and the scanner that bundles it
      - demo/**
      - frontend/**
      - desktop/src/**
      - desktop/scripts/demo-bundle.mjs
      - desktop/package*.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The demo bundle needs the desktop scanner, not Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            docs-site/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: frontend
      - run: npm run demo:bundle
        working-directory: desktop
      - run: npm run build:demo
        working-directory: frontend
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - name: Assemble the site, the demo and the docs
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R frontend/dist-demo _site/demo
          cp -R docs-site/.vitepress/dist _site/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
