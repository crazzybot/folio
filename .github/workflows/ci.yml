# Lint, type-check and test the frontend, the desktop app, the shared core and the MCP server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists a PR's files through the API

jobs:
  # Decides which jobs below run. Skipped jobs count as passing, so they can
  # stay required checks; a workflow-level `paths:` filter would leave them
  # pending instead. Editing this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mcp: ${{ steps.filter.outputs.mcp }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            core:
              - *ci
              - packages/core/**
              - tests/fixtures/**
            frontend:
              - *ci
              - frontend/**
              # Compiled into the app from source (sourceMap.ts)
              - packages/core/src/**
            desktop:
              - *ci
              - desktop/**
              # Compiled into the app from source
              - packages/core/src/**
              # Third-party notices (copy-renderer.mjs) and the license check
              - frontend/scripts/**
              - tests/fixtures/**
              # test/demoSearch.test.ts checks it against desktop/src/search.ts
              - frontend/src/demo/search.ts
            mcp:
              - *ci
              - packages/mcp/**
              # Bundled into the server from source
              - packages/core/src/**
            demo:
              - *ci
              - demo/**
              - frontend/**
              - desktop/src/**
              - packages/core/src/**
              - desktop/scripts/demo-bundle.mjs
              - desktop/package*.json

  # The desktop app and frontend share one version number
  # (scripts/release.mjs sets it); a hand edit that misses a file fails here
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/release.mjs --check

  # packages/core: the marks store, the scanner and locating quotes in the
  # source, shared by the desktop app, the frontend and the MCP server
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # macOS, like the desktop job: the marks tests cover case-insensitive paths
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # packages/mcp: the MCP server, and that it still bundles
  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    # macOS, like the core: the marks store's paths are case-insensitive there
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Licenses of production dependencies
        run: node scripts/check-licenses.mjs

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # macOS, like most users: the tests cover file watching and symlinks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Licenses of production dependencies
        run: node ../frontend/scripts/check-licenses.mjs

  # The live demo (docs/design/live-demo.md) still builds: its bundle, with
  # every seed mark found in its document, and the demo app. The Pages
  # workflow publishes the same build.
  demo:
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    env:
      # The bundle needs the desktop scanner, not Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: frontend
      - run: npm run demo:bundle
        working-directory: desktop
      - run: npm run build:demo
        working-directory: frontend
