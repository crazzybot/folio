# Lint, type-check and test the frontend, desktop app and backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter lists a PR's files through the API

jobs:
  # Decides which jobs below run. Skipped jobs count as passing, so they can
  # stay required checks; a workflow-level `paths:` filter would leave them
  # pending instead. Editing this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      backend: ${{ steps.filter.outputs.backend }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            frontend:
              - *ci
              - frontend/**
            desktop:
              - *ci
              - desktop/**
              # Third-party notices (copy-renderer.mjs) and the license check
              - frontend/scripts/**
              - tests/fixtures/**
              # test/demoSearch.test.ts checks it against desktop/src/search.ts
              - frontend/src/demo/search.ts
            backend:
              - *ci
              - backend/**
              - tests/fixtures/**
            demo:
              - *ci
              - demo/**
              - frontend/**
              - desktop/src/**
              - desktop/scripts/demo-bundle.mjs
              - desktop/package*.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Licenses of production dependencies
        run: node scripts/check-licenses.mjs

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # macOS, like most users: the tests cover file watching and symlinks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Licenses of production dependencies
        run: node ../frontend/scripts/check-licenses.mjs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -q

  # The live demo (docs/design/live-demo.md) still builds: its bundle, with
  # every seed mark found in its document, and the demo app. The Pages
  # workflow publishes the same build.
  demo:
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    env:
      # The bundle needs the desktop scanner, not Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: frontend
      - run: npm run demo:bundle
        working-directory: desktop
      - run: npm run build:demo
        working-directory: frontend
