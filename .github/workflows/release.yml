# Release: push a tag matching desktop/package.json's version (e.g. v0.1.0).
# Builds the desktop app for macOS (universal; signed and notarized),
# Windows and Linux into one draft GitHub Release, which you then review
# and publish. Installed apps find new versions there (electron-updater).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the app's version
        run: |
          version="v$(node -p 'require("./desktop/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match desktop/package.json version ($version)"
            exit 1
          fi
      # Created once here, so the parallel builds below all upload to it
      - name: Create the draft release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Folio ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    needs: draft
    runs-on: macos-latest
    # Signing and notarization secrets live in this environment (tags v* only)
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Write the notarization key to a file
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Build, sign, notarize and upload
        run: npx electron-builder --mac --publish always
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-linux:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      # Unsigned for now (see notes on Windows signing)
      - name: Build and upload
        run: npx electron-builder ${{ matrix.target }} --publish always
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
