[project]
name = "backend"
version = "0.3.0"
description = "Folio backend: serves a folder of Markdown files over a small REST API"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
