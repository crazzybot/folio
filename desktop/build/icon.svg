<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Folio app icon: an open book with a bookmark ribbon on the app's dark theme.
       Body follows the macOS icon grid (824px tile inset 100px on a 1024 canvas). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3038"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset=".8" stop-color="#ebe7de"/>
      <stop offset="1" stop-color="#cfc9bc"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset=".8" stop-color="#f1eee7"/>
      <stop offset="1" stop-color="#d8d2c6"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3794ff"/>
      <stop offset="1" stop-color="#0068c0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>

  <!-- Soft shadow under the book -->
  <ellipse cx="512" cy="760" rx="280" ry="38" fill="#000" opacity=".55" filter="url(#shadow)"/>

  <!-- Bookmark ribbon, hanging out from under the pages -->
  <path d="M636 640 L690 640 L690 846 L663 818 L636 846 Z" fill="url(#ribbon)"/>
  <path d="M636 700 L690 700 L690 742 C672 736 654 736 636 742 Z" fill="#004f94" opacity=".55"/>

  <!-- Page block thickness -->
  <path d="M512 384 C440 344 340 329 238 344 L238 724 C340 709 440 724 512 764 C584 724 684 709 786 724 L786 344 C684 329 584 344 512 384 Z" fill="#a69f91"/>
  <path d="M512 372 C440 332 340 317 244 332 L244 712 C340 697 440 712 512 752 C584 712 684 697 780 712 L780 332 C684 317 584 332 512 372 Z" fill="#c9c2b4"/>

  <!-- Pages -->
  <path d="M512 360 C440 320 340 305 250 320 L250 700 C340 685 440 700 512 740 Z" fill="url(#pageL)"/>
  <path d="M512 360 C584 320 684 305 774 320 L774 700 C684 685 584 700 512 740 Z" fill="url(#pageR)"/>
  <path d="M512 362 L512 738" stroke="#000" stroke-opacity=".18" stroke-width="4"/>

  <!-- Left page: heading + text lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M466 409 Q390 382 305 384" stroke="#0078d4" stroke-width="22" stroke-dasharray="120 400" stroke-dashoffset="-46"/>
    <g stroke="#9a9488" stroke-width="12">
      <path d="M466 464 Q390 437 305 439"/>
      <path d="M466 509 Q390 482 305 484"/>
      <path d="M466 554 Q390 527 305 529"/>
      <path d="M466 599 Q390 572 305 574" stroke-dasharray="110 400" stroke-dashoffset="-56"/>
    </g>
  </g>

  <!-- Right page: text lines -->
  <g fill="none" stroke="#9a9488" stroke-width="12" stroke-linecap="round">
    <path d="M558 409 Q634 382 719 384"/>
    <path d="M558 454 Q634 427 719 429"/>
    <path d="M558 499 Q634 472 719 474"/>
    <path d="M558 544 Q634 517 719 519"/>
    <path d="M558 589 Q634 562 719 564" stroke-dasharray="100 400"/>
  </g>

</svg>
