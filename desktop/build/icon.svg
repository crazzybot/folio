<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Folio app icon: icon-source/folio-dark.png (generated artwork) placed on
       Apple's macOS icon grid — its tile (~1000 px in the source) scaled to
       ~824 px and centred, leaving the standard transparent margin.
       Rebuild: rsvg-convert -w 1024 icon.svg -o icon.png, plus the .icns set. -->
  <image x="100" y="100" width="824" height="824" preserveAspectRatio="xMidYMid meet" xlink:href="icon-source/folio-dark.png"/>
</svg>
